<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImpakOS - Assistente</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/impak-icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
--bg:#f7f7f5;--card:#fff;--border:#e6e6e2;--border-strong:#d6d6d0;--text:#111111;--muted:#6b6b66;--dim:#71716b;
--ac:#111111;--ac-soft:#f0f0ed;--ok:#15803d;--err:#dc2626;--warn:#b45309;
--r-md:8px;--r-lg:12px;--r-xl:16px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;}
#app{flex:1;display:grid;grid-template-columns:280px 1fr;min-height:0;height:calc(100vh - 52px);}
/* ── lista de conversas ── */
.lista{background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}
.lista .topo{padding:16px 16px 10px;}
.btn-nova{width:100%;background:#fff;border:1px solid var(--border-strong);border-radius:var(--r-md);padding:10px 14px;font:inherit;font-size:14px;font-weight:500;color:var(--text);cursor:pointer;text-align:center;}
.btn-nova:hover{background:var(--ac-soft);}
.lista .rotulo{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);padding:10px 20px 4px;}
.lista .itens{overflow:auto;flex:1;padding:0 8px 16px;}
.conv{display:block;width:100%;background:none;border:0;text-align:left;padding:10px 12px;border-radius:var(--r-md);cursor:pointer;font:inherit;color:var(--text);}
.conv:hover{background:var(--ac-soft);}
.conv.ativa{background:var(--ac-soft);}
.conv .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conv .d{font-size:12px;color:var(--dim);margin-top:2px;}
.conv .x{float:right;color:var(--dim);font-size:12px;padding:0 4px;display:none;}
.conv:hover .x{display:inline;}
.vazio-lista{color:var(--dim);font-size:13px;padding:8px 20px;}
/* ── área principal ── */
.main{display:flex;flex-direction:column;min-height:0;}
.cab{background:var(--card);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.cab h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.2px;}
.cab .perfil{font-size:12px;color:var(--muted);text-align:right;line-height:1.5;}
.cab .perfil b{color:var(--text);font-weight:600;}
.msgs{flex:1;overflow:auto;padding:28px 32px;}
.centro{max-width:980px;margin:0 auto;}
.saud .av{width:52px;height:52px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;margin-bottom:18px;}
.saud h2{margin:0 0 10px;font-size:22px;font-weight:600;letter-spacing:-.2px;}
.saud p{margin:0 0 26px;color:var(--muted);font-size:15px;line-height:1.55;max-width:900px;}
.sug{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
.sug button{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;text-align:left;cursor:pointer;font:inherit;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.03);}
.sug button:hover{border-color:var(--border-strong);box-shadow:0 4px 12px rgba(0,0,0,.05);}
.sug .k{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);margin-bottom:8px;}
.sug .q{font-size:15px;font-weight:500;line-height:1.4;}
.msg{display:flex;gap:14px;margin-bottom:26px;}
.msg .av{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
.msg.user .av{background:#e9e9e5;color:var(--text);}
.msg.bot .av{background:var(--ac);color:#fff;}
.msg .corpo{flex:1;min-width:0;font-size:15px;line-height:1.6;}
.msg .corpo p{margin:0 0 10px;}
.msg .corpo table{border-collapse:collapse;margin:8px 0 12px;font-size:13.5px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;}
.msg .corpo th,.msg .corpo td{padding:7px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;}
.msg .corpo th{background:#fafaf8;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
.msg .corpo tr:last-child td{border-bottom:0;}
.msg .corpo code{font-family:'JetBrains Mono',monospace;font-size:13px;background:#f0f0ed;padding:1px 5px;border-radius:4px;}
.msg .corpo ul,.msg .corpo ol{margin:4px 0 10px 22px;padding:0;}
.msg .corpo li{margin:2px 0;}
.msg .corpo h3{font-size:15px;margin:12px 0 6px;}
.msg .meta{font-size:11.5px;color:var(--dim);margin-top:6px;}
.msg .meta span{display:inline-block;background:#f0f0ed;border-radius:12px;padding:1px 8px;margin-right:4px;font-family:'JetBrains Mono',monospace;font-size:11px;}
.msg.pensando .corpo{color:var(--dim);}
.pontos::after{content:'';animation:pts 1.2s infinite;}
@keyframes pts{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}
.erro{color:var(--err);}
/* ── input ── */
.entrada{padding:16px 32px 10px;}
.entrada .box{max-width:980px;margin:0 auto;background:var(--card);border:1.5px solid var(--text);border-radius:var(--r-lg);display:flex;align-items:flex-end;padding:8px 8px 8px 16px;gap:8px;}
.entrada textarea{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:15px;line-height:1.5;max-height:160px;padding:8px 0;background:transparent;color:var(--text);}
.entrada button{flex:none;width:40px;height:40px;border-radius:var(--r-md);border:0;background:var(--text);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.entrada button:disabled{background:#c9c9c4;cursor:default;}
.rodape{text-align:center;font-size:12px;color:var(--dim);padding:0 32px 14px;}
@media (max-width: 860px){
  #app{grid-template-columns:1fr;}
  .lista{display:none;}
  .cab,.msgs,.entrada{padding-left:16px;padding-right:16px;}
}
</style>
</head>
<body>
<div id="app">
  <aside class="lista">
    <div class="topo"><button class="btn-nova" onclick="novaConversa()">Nova conversa</button></div>
    <div class="rotulo">Recentes</div>
    <div class="itens" id="lista-conversas"><div class="vazio-lista">Carregando…</div></div>
  </aside>
  <section class="main">
    <div class="cab">
      <h1 id="titulo-conversa">Nova conversa</h1>
      <div class="perfil" id="perfil"></div>
    </div>
    <div class="msgs" id="msgs"><div class="centro" id="centro"></div></div>
    <div class="entrada">
      <div class="box">
        <textarea id="entrada" rows="1" aria-label="Pergunta para o Assistente" placeholder="Pergunte algo ao Assistente…" onkeydown="teclaEntrada(event)" oninput="autoAltura(this)"></textarea>
        <button id="btn-enviar" onclick="enviar()" title="Enviar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
    <div class="rodape">O Assistente responde só com os dados do ImpakOS que o seu perfil permite. Confira informações importantes antes de decidir.</div>
  </section>
</div>

<script>
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let _me = null, _conversaId = null, _mensagens = [], _enviando = false, _ferramentas = [];

// Markdown mínimo (negrito, itálico, código, listas, tabelas, títulos) — sem HTML do modelo.
function md(texto){
  const linhas = String(texto || '').split('\n');
  let html = '', i = 0;
  const inline = t => esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<i>$2</i>');
  while(i < linhas.length){
    const l = linhas[i];
    if(/^\s*\|.*\|\s*$/.test(l) && i + 1 < linhas.length && /^\s*\|[\s:|-]+\|\s*$/.test(linhas[i+1])){
      const cab = l.trim().slice(1,-1).split('|').map(c => c.trim());
      i += 2; let rows = '';
      while(i < linhas.length && /^\s*\|.*\|\s*$/.test(linhas[i])){ rows += '<tr>' + linhas[i].trim().slice(1,-1).split('|').map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; i++; }
      html += '<table><thead><tr>' + cab.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table>'; continue;
    }
    if(/^\s*[-*•]\s+/.test(l)){ let it = ''; while(i < linhas.length && /^\s*[-*•]\s+/.test(linhas[i])){ it += '<li>' + inline(linhas[i].replace(/^\s*[-*•]\s+/,'')) + '</li>'; i++; } html += '<ul>' + it + '</ul>'; continue; }
    if(/^\s*\d+[.)]\s+/.test(l)){ let it = ''; while(i < linhas.length && /^\s*\d+[.)]\s+/.test(linhas[i])){ it += '<li>' + inline(linhas[i].replace(/^\s*\d+[.)]\s+/,'')) + '</li>'; i++; } html += '<ol>' + it + '</ol>'; continue; }
    if(/^#{1,4}\s+/.test(l)){ html += '<h3>' + inline(l.replace(/^#{1,4}\s+/,'')) + '</h3>'; i++; continue; }
    if(!l.trim()){ i++; continue; }
    let p = l; i++;
    while(i < linhas.length && linhas[i].trim() && !/^\s*([-*•]|\d+[.)]|#|\|)/.test(linhas[i])){ p += '\n' + linhas[i]; i++; }
    html += '<p>' + inline(p).replace(/\n/g,'<br>') + '</p>';
  }
  return html;
}

function iniciais(n){ return String(n || '?').trim().split(/\s+/).slice(0,2).map(x => x[0]).join('').toUpperCase(); }
function fmtData(iso){ if(!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('pt-BR'); }

function renderSaudacao(){
  const nome = (_me && (_me.displayName || _me.nome || _me.usuario)) || '';
  const temFin = _ferramentas.includes('faturamento');
  const temAg = _ferramentas.includes('agenda_pendencias');
  const sug = [
    ['Cadastros', 'Quais clientes temos em Santa Catarina?'],
    ['Processos', 'O que chega este mês e no próximo, por porto?'],
    temFin ? ['Financeiro', 'Quanto faturamos no mês passado, por cliente?'] : (temAg ? ['Agenda', 'O que está atrasado na minha agenda?'] : ['Processos', 'Quais processos estão em águas agora?']),
  ];
  document.getElementById('centro').innerHTML = `
    <div class="saud">
      <div class="av">${esc(iniciais(nome).slice(0,1) || 'A')}</div>
      <h2>Olá, ${esc(nome.split(' ')[0])}!</h2>
      <p>Sou o Assistente do ImpakOS. Pergunte sobre cadastros, processos, agenda e financeiro. Respondo só com o que o seu perfil permite.</p>
      <div class="sug">${sug.map(([k,q]) => `<button onclick="perguntar(${JSON.stringify(q).replace(/"/g,'&quot;')})"><div class="k">${esc(k)}</div><div class="q">${esc(q)}</div></button>`).join('')}</div>
    </div>`;
}
function renderMensagens(){
  const c = document.getElementById('centro');
  if(!_mensagens.length){ renderSaudacao(); return; }
  const nome = (_me && (_me.displayName || _me.nome || _me.usuario)) || '';
  c.innerHTML = _mensagens.map(m => m.role === 'user'
    ? `<div class="msg user"><div class="av">${esc(iniciais(nome))}</div><div class="corpo">${md(m.content)}</div></div>`
    : `<div class="msg bot${m.pensando ? ' pensando' : ''}"><div class="av">A</div><div class="corpo">${m.pensando ? '<span class="pontos">Consultando o ImpakOS</span>' : (m.erro ? '<span class="erro">' + esc(m.content) + '</span>' : md(m.content))}${m.ferramentas && m.ferramentas.length ? '<div class="meta">Consultou: ' + m.ferramentas.map(f => '<span>' + esc(f) + '</span>').join('') + '</div>' : ''}</div></div>`
  ).join('');
  const box = document.getElementById('msgs'); box.scrollTop = box.scrollHeight;
}

async function carregarLista(){
  try {
    const r = await fetch('/api/assistente/conversas').then(x => x.json());
    if(!r.ok) throw new Error(r.erro);
    _ferramentas = r.ferramentas || [];
    const el = document.getElementById('lista-conversas');
    if(!r.conversas.length){ el.innerHTML = '<div class="vazio-lista">Nenhuma conversa ainda.</div>'; }
    else el.innerHTML = r.conversas.map(c => `<button class="conv${c.id === _conversaId ? ' ativa' : ''}" onclick="abrirConversa('${esc(c.id)}')"><span class="x" onclick="arquivar(event,'${esc(c.id)}')" title="Arquivar">✕</span><div class="t">${esc(c.titulo || 'Conversa')}</div><div class="d">${fmtData(c.updated_at)}</div></button>`).join('');
    if(!_mensagens.length) renderSaudacao();
  } catch(e){ document.getElementById('lista-conversas').innerHTML = '<div class="vazio-lista">' + esc(e.message) + '</div>'; }
}
async function abrirConversa(id){
  const r = await fetch('/api/assistente/conversas/' + encodeURIComponent(id)).then(x => x.json());
  if(!r.ok) return;
  _conversaId = id; _mensagens = (r.conversa.mensagens || []).map(m => ({ role: m.role, content: m.content, ferramentas: m.ferramentas }));
  document.getElementById('titulo-conversa').textContent = r.conversa.titulo || 'Conversa';
  renderMensagens(); carregarLista();
}
async function arquivar(ev, id){
  ev.stopPropagation();
  if(!confirm('Tirar esta conversa da lista?')) return;
  await fetch('/api/assistente/conversas/' + encodeURIComponent(id) + '/arquivar', { method: 'POST' });
  if(_conversaId === id) novaConversa(); else carregarLista();
}
function novaConversa(){ _conversaId = null; _mensagens = []; document.getElementById('titulo-conversa').textContent = 'Nova conversa'; renderSaudacao(); carregarLista(); document.getElementById('entrada').focus(); }
function perguntar(q){ document.getElementById('entrada').value = q; enviar(); }
function teclaEntrada(ev){ if(ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); enviar(); } }
function autoAltura(t){ t.style.height = 'auto'; t.style.height = Math.min(160, t.scrollHeight) + 'px'; }

async function enviar(){
  if(_enviando) return;
  const t = document.getElementById('entrada'); const texto = t.value.trim(); if(!texto) return;
  t.value = ''; autoAltura(t);
  _enviando = true; document.getElementById('btn-enviar').disabled = true;
  _mensagens.push({ role: 'user', content: texto }); _mensagens.push({ role: 'assistant', pensando: true }); renderMensagens();
  if(!_conversaId) document.getElementById('titulo-conversa').textContent = texto.length > 60 ? texto.slice(0,57) + '…' : texto;
  try {
    const r = await fetch('/api/assistente/mensagem', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ conversa_id: _conversaId, mensagem: texto }) }).then(x => x.json());
    _mensagens.pop();
    if(!r.ok) throw new Error(r.erro || 'Falha ao responder');
    _conversaId = r.conversa_id || _conversaId;
    _mensagens.push({ role: 'assistant', content: r.resposta, ferramentas: (r.ferramentas || []).map(f => f.nome) });
  } catch(e){
    if(_mensagens.length && _mensagens[_mensagens.length-1].pensando) _mensagens.pop();
    _mensagens.push({ role: 'assistant', content: 'Não consegui responder: ' + e.message, erro: true });
  }
  _enviando = false; document.getElementById('btn-enviar').disabled = false;
  renderMensagens(); carregarLista(); t.focus();
}

(async () => {
  try { _me = await fetch('/api/me').then(x => x.json()); } catch(e){ _me = {}; }
  const nome = _me.displayName || _me.nome || _me.usuario || '';
  document.getElementById('perfil').innerHTML = `<b>${esc(nome)}</b><br>${esc(_me.role === 'gerente' ? 'Gerente' : 'Analista')} · ${esc((_me.modulos || []).join(', '))}`;
  await carregarLista();
})();
</script>
<script src="/chat.js"></script>
</body>
</html>
