<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IMPAK — Controle de Processos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#e8f0f8;--bg2:#dce8f5;--surface:#fff;--surface2:#f0f6fc;
  --border:#c8d8e8;--text:#0d1e2e;--text-dim:#4a6480;--text-bright:#0a2d5e;
  --accent:#1a7fd4;--accent2:#1567b8;
  --ok:#16a34a;--warn:#d97706;--err:#dc2626;
}
body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh;}

/* ── TOPBAR ── */
.topbar{background:var(--text-bright);height:52px;display:flex;align-items:center;padding:0 20px;gap:14px;border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:200;}
.brand{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;color:#fff;letter-spacing:1px;}
.brand span{color:var(--accent);}
.tnav{padding:5px 12px;border-radius:5px;font-size:11px;font-weight:700;color:rgba(255,255,255,.55);text-decoration:none;font-family:'Syne',sans-serif;text-transform:uppercase;letter-spacing:.5px;transition:all .15s;}
.tnav:hover,.tnav.on{background:rgba(26,127,212,.25);color:#fff;}
.ml{margin-left:auto;display:flex;align-items:center;gap:10px;}
.ubadge{font-size:11px;color:rgba(255,255,255,.55);font-family:'DM Mono',monospace;}
.btn-out{background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:5px;color:rgba(255,255,255,.5);padding:4px 10px;font-size:11px;cursor:pointer;}
.btn-out:hover{border-color:rgba(255,255,255,.5);color:#fff;}
.cambio-bar{display:flex;gap:10px;align-items:center;margin-left:16px;}
.cambio-item{font-size:11px;color:rgba(255,255,255,.7);font-family:'DM Mono',monospace;background:rgba(255,255,255,.06);padding:3px 8px;border-radius:4px;}
.cambio-item span{color:#7dd3fc;font-weight:700;}

/* ── MAIN ── */
.wrap{padding:18px 22px;}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.ptitle{font-family:'Syne',sans-serif;font-size:19px;font-weight:800;color:var(--text-bright);}
.ptitle span{color:var(--accent);}
.ph-right{display:flex;gap:8px;align-items:center;}

/* ── BTN ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 15px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:'Syne',sans-serif;transition:all .15s;}
.btn-p{background:var(--accent);color:#fff;}
.btn-p:hover{background:var(--accent2);}
.btn-s{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
.btn-s:hover{border-color:var(--accent);color:var(--accent);}
.btn-d{background:transparent;border:1px solid rgba(220,38,38,.3);color:var(--err);}
.btn-d:hover{background:rgba(220,38,38,.06);}
.btn-sm{padding:5px 10px;font-size:11px;}

/* ── STATS ── */
.stats{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 14px;cursor:pointer;transition:border-color .15s;display:flex;align-items:center;gap:10px;}
.scard:hover,.scard.on{border-color:var(--accent);}
.scard.on{background:rgba(26,127,212,.04);}
.sn{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;}
.sl{font-size:10px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.blue{color:var(--accent);}
.ok{color:var(--ok);}
.warn{color:var(--warn);}
.err{color:var(--err);}
.dim{color:var(--text-dim);}

/* ── FILTROS ── */
.fbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:11px 14px;}
.fi{display:flex;flex-direction:column;gap:3px;}
.fi label{font-size:10px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;}
.fi input,.fi select{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:12px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s;}
.fi input:focus,.fi select:focus{border-color:var(--accent);}
.fi input{width:200px;}
.fi select{min-width:120px;}
.btn-clr{background:none;border:none;font-size:11px;color:var(--text-dim);cursor:pointer;text-decoration:underline;padding:0;align-self:flex-end;margin-bottom:1px;}
.btn-clr:hover{color:var(--accent);}

/* ── TABELA ── */
.tw{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.ttop{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--border);background:var(--surface2);}
.tcount{font-size:11px;color:var(--text-dim);font-family:'DM Mono',monospace;}
.tscroll{overflow-x:auto;max-height:calc(100vh - 320px);overflow-y:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{background:var(--surface2);padding:8px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;z-index:5;}
th:hover{color:var(--accent);}
th.asc::after{content:' ↑';}
th.desc::after{content:' ↓';}
td{padding:7px 10px;border-bottom:1px solid var(--bg2);vertical-align:middle;white-space:nowrap;}
tr.trow:hover td{background:rgba(26,127,212,.03);cursor:pointer;}
tr.trow.demur-crit td{background:rgba(220,38,38,.03);}
tr.trow.demur-warn td{background:rgba(217,119,6,.025);}
.empty{text-align:center;padding:48px;color:var(--text-dim);}

/* ── CÉLULAS ── */
.ref{font-family:'DM Mono',monospace;font-weight:500;color:var(--accent);}
.mono{font-family:'DM Mono',monospace;}
.status-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;white-space:nowrap;}
.s-PRODUCAO{background:rgba(99,102,241,.1);color:#6366f1;}
.s-EMBARCADO{background:rgba(14,165,233,.1);color:#0ea5e9;}
.s-PORTO{background:rgba(245,158,11,.1);color:#d97706;}
.s-LIBERACAO{background:rgba(239,68,68,.1);color:#dc2626;}
.s-RETIRADO{background:rgba(16,185,129,.1);color:#10b981;}
.s-FINALIZADO{background:rgba(139,92,246,.1);color:#8b5cf6;}
.demur-chip{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;font-family:'DM Mono',monospace;white-space:nowrap;}
.dc-ok{background:rgba(22,163,74,.1);color:var(--ok);}
.dc-w{background:rgba(217,119,6,.1);color:var(--warn);}
.dc-e{background:rgba(220,38,38,.12);color:var(--err);}
.dc-n{color:var(--text-dim);}
.canal-chip{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;}
.cc-VERDE{background:rgba(22,163,74,.1);color:var(--ok);}
.cc-AMARELO{background:rgba(217,119,6,.1);color:var(--warn);}
.cc-VERMELHO{background:rgba(220,38,38,.1);color:var(--err);}
.cc-CINZA{background:rgba(100,116,128,.1);color:#64748b;}
.pend-cell{max-width:190px;overflow:hidden;text-overflow:ellipsis;color:var(--text-dim);font-size:11px;}

/* ── MODAL ── */
.ov{position:fixed;inset:0;background:rgba(10,30,60,.5);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:14px;overflow-y:auto;}
.ov.on{display:flex;}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:920px;margin:auto;box-shadow:0 20px 60px rgba(10,30,60,.25);overflow:hidden;}
.mh{background:var(--text-bright);padding:15px 20px;display:flex;align-items:center;gap:12px;justify-content:space-between;}
.mh-left{display:flex;align-items:center;gap:12px;}
.mh-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:#fff;}
.mh-title span{color:var(--accent);}
.mh-demur{font-size:11px;font-weight:700;padding:3px 10px;border-radius:4px;}
.mh-close{background:none;border:none;color:rgba(255,255,255,.5);font-size:18px;cursor:pointer;padding:2px 6px;border-radius:3px;}
.mh-close:hover{color:#fff;}

/* ── MODAL TABS ── */
.mtabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface2);}
.mtab{padding:10px 18px;font-size:11px;font-weight:700;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;font-family:'Syne',sans-serif;text-transform:uppercase;letter-spacing:.5px;transition:all .15s;}
.mtab.on{color:var(--accent);border-bottom-color:var(--accent);}
.mtc{display:none;padding:18px 20px;}
.mtc.on{display:block;}
.mfoot{padding:11px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--surface2);}

/* ── STEPPER ── */
.stepper{display:flex;margin-bottom:18px;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.step{flex:1;padding:9px 4px;text-align:center;cursor:pointer;border-right:1px solid var(--border);transition:all .15s;background:var(--surface2);}
.step:last-child{border-right:none;}
.step:hover{background:var(--bg2);}
.step.done{background:rgba(22,163,74,.06);}
.step.active{background:rgba(26,127,212,.08);}
.step-icon{font-size:15px;margin-bottom:3px;}
.step-lbl{font-size:10px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;}
.step.done .step-lbl{color:var(--ok);}
.step.active .step-lbl{color:var(--accent);}

/* ── FORM ── */
.sec{margin-bottom:16px;}
.sec-hd{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-dim);margin-bottom:9px;padding-bottom:5px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;}
.sec-tag{font-size:9px;padding:1px 6px;border-radius:3px;background:rgba(26,127,212,.08);color:var(--accent);font-weight:700;}
.sec-restricted{font-size:9px;padding:1px 6px;border-radius:3px;background:rgba(220,38,38,.08);color:var(--err);font-weight:700;}
.grid{display:grid;gap:9px;}
.g2{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:1fr 1fr 1fr;}
.g4{grid-template-columns:1fr 1fr 1fr 1fr;}
.full{grid-column:1/-1;}
.field{display:flex;flex-direction:column;gap:3px;}
.field label{font-size:10px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.by{font-size:9px;font-weight:400;color:var(--accent);text-transform:none;letter-spacing:0;font-style:italic;}
input,select,textarea{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;transition:all .15s;width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:#fff;}
input.changed,select.changed,textarea.changed{border-color:rgba(22,163,74,.5);background:rgba(22,163,74,.02);}
textarea{resize:vertical;min-height:58px;}
input[disabled],select[disabled],textarea[disabled]{opacity:.5;cursor:not-allowed;}

/* ── UPLOAD / IA ── */
.upload-box{border:2px dashed var(--border);border-radius:8px;padding:14px;text-align:center;cursor:pointer;background:var(--bg2);transition:all .2s;}
.upload-box:hover,.upload-box.drag{border-color:var(--accent);background:rgba(26,127,212,.04);}
.upload-box input{display:none;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.chip{background:rgba(26,127,212,.08);border:1px solid rgba(26,127,212,.2);border-radius:4px;padding:3px 8px;font-size:11px;color:var(--accent);display:flex;align-items:center;gap:4px;font-family:'DM Mono',monospace;}
.cx{cursor:pointer;opacity:.6;line-height:1;}
.cx:hover{opacity:1;}
.ebox{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:13px;margin-top:11px;}
.erow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);}
.erow:last-child{border-bottom:none;}
.elbl{font-size:11px;font-weight:600;color:var(--text-dim);min-width:150px;}
.eval{font-size:12px;color:var(--text);font-family:'DM Mono',monospace;flex:1;}
.eb{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;white-space:nowrap;}
.eb-n{background:rgba(22,163,74,.1);color:var(--ok);}
.eb-c{background:rgba(217,119,6,.1);color:var(--warn);}

/* ── LOG ── */
.log-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);}
.log-row:last-child{border-bottom:none;}
.log-time{font-family:'DM Mono',monospace;font-size:10px;color:var(--text-dim);white-space:nowrap;min-width:125px;}
.log-user{font-weight:600;color:var(--accent);}
.log-chg{font-size:11px;color:var(--text-dim);margin-top:2px;}
.log-val{font-family:'DM Mono',monospace;color:var(--text);}

/* ── TOAST / SPINNER ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--text-bright);color:#fff;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;z-index:9999;display:none;box-shadow:0 4px 16px rgba(0,0,0,.2);}
.toast.on{display:block;}
.toast.ok{border-left:3px solid var(--ok);}
.toast.err{border-left:3px solid var(--err);}
.toast.warn{border-left:3px solid var(--warn);}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(26,127,212,.2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── LOGIN ── */
.login-wrap{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;}
.login-box{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:14px;padding:36px 32px;width:340px;}
.login-logo{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--text-bright);text-align:center;margin-bottom:4px;}
.login-logo span{color:var(--accent);}
.login-sub{font-size:11px;color:var(--text-dim);text-align:center;margin-bottom:22px;text-transform:uppercase;letter-spacing:1px;}
.lerr{background:rgba(220,38,38,.07);border:1px solid rgba(220,38,38,.2);border-radius:5px;padding:7px 11px;font-size:12px;color:var(--err);margin-bottom:12px;display:none;}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-logo">IMP<span>AK</span></div>
    <div class="login-sub">Controle de Processos</div>
    <div class="lerr" id="lerr">Usuário ou senha incorretos.</div>
    <div class="field" style="margin-bottom:10px">
      <label>Usuário</label>
      <input id="lu" type="text" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="field" style="margin-bottom:16px">
      <label>Senha</label>
      <input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-p" style="width:100%;justify-content:center" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar" id="topbar" style="display:none">
  <div class="brand">IMP<span>AK</span></div>
  <a class="tnav" href="/">TyreDesk</a>
  <a class="tnav" href="/processos">Conferência</a>
  <a class="tnav on" href="/controle">Controle</a>
  <div class="cambio-bar" id="cambioBar"></div>
  <div class="ml">
    <span class="ubadge" id="ubadge"></span>
    <div style="display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:3px 8px;">
      <span style="font-size:10px;color:rgba(255,255,255,.5);font-weight:700;text-transform:uppercase;letter-spacing:.5px;">API Key</span>
      <input id="apiKeyInput" type="password" placeholder="sk-ant-..." 
        style="background:transparent;border:none;color:#fff;font-family:'DM Mono',monospace;font-size:11px;outline:none;width:140px;"
        oninput="saveApiKey(this.value)">
      <span id="apiStatus" style="font-size:14px">⚪</span>
    </div>
    <button class="btn-out" onclick="doLogout()">Sair</button>
  </div>
</div>

<!-- CONTEÚDO -->
<div class="wrap" id="wrap" style="display:none">
  <div class="ph">
    <div class="ptitle">Controle de <span>Processos</span></div>
    <div class="ph-right">
      <button class="btn btn-p" onclick="abrirNovo()">+ Novo Processo</button>
    <label class="btn" style="background:var(--ok);cursor:pointer" title="Importar planilhas Excel">
      📥 Importar Excel
      <input type="file" accept=".xlsx" multiple style="display:none" onchange="importarExcel(this.files)">
    </label>
    </div>
  </div>

  <div class="stats" id="statsEl"></div>

  <div class="fbar">
    <div class="fi"><label>Buscar</label><input id="fq" placeholder="Ref., cliente, container, navio..." oninput="render()"></div>
    <div class="fi"><label>Status</label>
      <select id="ff" onchange="render()">
        <option value="">Todos</option>
        <option value="PRODUCAO">Em Produção</option>
        <option value="EMBARCADO">Embarcado</option>
        <option value="PORTO">No Porto</option>
        <option value="LIBERACAO">Liberação</option>
        <option value="RETIRADO">Retirado</option>
        <option value="FINALIZADO">Finalizado</option>
      </select>
    </div>
    <div class="fi"><label>Cliente</label><select id="fc" onchange="render()"><option value="">Todos</option></select></div>
    <div class="fi"><label>Porto</label><select id="fp" onchange="render()"><option value="">Todos</option></select></div>
    <div class="fi"><label>Agente</label><select id="fa" onchange="render()"><option value="">Todos</option></select></div>
    <button class="btn-clr" onclick="limparFiltros()">✕ Limpar</button>
  </div>

  <div class="tw">
    <div class="ttop">
      <span class="tcount" id="tcount"></span>
      <span style="font-size:11px;color:var(--text-dim)">Clique para abrir · última atualização: <span id="lastSync">—</span></span>
    </div>
    <div class="tscroll">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="ov" id="ov">
  <div class="modal">
    <div class="mh">
      <div class="mh-left">
        <div class="mh-title" id="mh-title">Processo</div>
        <div id="mh-demur"></div>
      </div>
      <button class="mh-close" onclick="fechar()">✕</button>
    </div>
    <div class="mtabs">
      <div class="mtab on" onclick="tab('dados')">📋 Dados</div>
      <div class="mtab" onclick="tab('ia')">📄 Extrair com IA</div>
      <div class="mtab" onclick="tab('log')">📝 Histórico</div>
    </div>
    <div class="mtc on" id="tc-dados"></div>
    <div class="mtc" id="tc-ia"></div>
    <div class="mtc" id="tc-log"></div>
    <div class="mfoot" id="mfoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══ CONFIG ════════════════════════════════════════════════════
const USERS = [
  {u:'narcelio', p:'Narcelio@2026', n:'Narcelio', fin:true},
  {u:'jean',     p:'Jeanimpak2026', n:'Jean',     fin:true},
  {u:'paula',    p:'Paula@2026',    n:'Paula',    fin:true},
  {u:'bianca',   p:'Bianca@2026',   n:'Bianca',   fin:true},
  {u:'emanuelly',p:'EmanuellyImpak2026',n:'Emanuelly',fin:false},
  {u:'italo',    p:'Italo@2026',    n:'Italo',    fin:false},
  {u:'maria',    p:'Maria@2026',    n:'Maria',    fin:false},
  {u:'joyce',    p:'Joyce@2026',    n:'Joyce',    fin:false},
  {u:'neide',    p:'Neide@2026',    n:'Neide',    fin:false},
];

const FASES = [
  {id:'PRODUCAO',  label:'Em Produção', icon:'🔵'},
  {id:'EMBARCADO', label:'Embarcado',   icon:'🚢'},
  {id:'PORTO',     label:'No Porto',    icon:'⚓'},
  {id:'LIBERACAO', label:'Liberação',   icon:'📋'},
  {id:'RETIRADO',  label:'Retirado',    icon:'🚛'},
  {id:'FINALIZADO',label:'Finalizado',  icon:'✅'},
];

// Campos por fase — o que aparece em cada etapa
const FASE_CAMPOS = {
  PRODUCAO:  ['produtos','quant_containers','data_pedido','previsao_prontidao','observacoes'],

// ══ ESTADO ═══════════════════════════════════════════════════
let _u=null, _processos=[], _edit=null, _files={}, _apiKey='';
let _sortK='eta', _sortD=1, _filtStat='';

// ══ AUTH ══════════════════════════════════════════════════════
function doLogin(){
  const u=(document.getElementById('lu').value||'').trim().toLowerCase();
  const p=(document.getElementById('lp').value||'').trim();
  const f=USERS.find(x=>x.u===u&&x.p===p);
  if(!f){document.getElementById('lerr').style.display='block';return;}
  entrar(f);
}
function entrar(f){
  _u=f;
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('topbar').style.display='flex';
  document.getElementById('wrap').style.display='block';
  document.getElementById('ubadge').textContent=f.n;
  // Carregar API key salva
  try{
    const saved=localStorage.getItem('impak_apikey')||'';
    if(saved){_apiKey=saved;document.getElementById('apiKeyInput').value=saved;}
  }catch(e){}
  updateApiStatus();
  carregarCambio();
  load();
}
function saveApiKey(v){
  _apiKey=v.trim();
  try{localStorage.setItem('impak_apikey',v.trim());}catch(e){}
  updateApiStatus();
}
function updateApiStatus(){
  const el=document.getElementById('apiStatus');
  if(!el)return;
  el.textContent=_apiKey&&_apiKey.length>20?'🟢':'⚪';
}
function doLogout(){
  _u=null;
  document.getElementById('loginWrap').style.display='flex';
  document.getElementById('topbar').style.display='none';
  document.getElementById('wrap').style.display='none';
}
fetch('/api/me').then(r=>r.json()).then(d=>{
  if(d.logado){const f=USERS.find(x=>x.u===d.usuario);if(f){entrar(f);}}
}).catch(()=>{});

// ══ CÂMBIO ════════════════════════════════════════════════════
function carregarCambio(){
  fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,CNY-BRL')
  .then(r=>r.json())
  .then(d=>{
    const bar=document.getElementById('cambioBar');
    const usd=parseFloat(d.USDBRL?.bid||0).toFixed(2);
    const eur=parseFloat(d.EURBRL?.bid||0).toFixed(2);
    const cny=parseFloat(d.CNYBRL?.bid||0).toFixed(2);
    bar.innerHTML=`
      <div class="cambio-item">USD <span>R$ ${usd}</span></div>
      <div class="cambio-item">EUR <span>R$ ${eur}</span></div>
      <div class="cambio-item">CNY <span>R$ ${cny}</span></div>`;
  }).catch(()=>{});
  // Atualiza a cada 5 minutos
  setTimeout(carregarCambio, 5*60*1000);
}

// ══ STORAGE ══════════════════════════════════════════════════
function save(cb){
  toast('Salvando...','ok');
  fetch('/api/controle/salvar',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({processos:_processos})})
  .then(r=>r.json())
  .then(d=>{
    if(d.ok){toast('Salvo ✓','ok');if(cb)cb();}
    else toast('Erro ao salvar.','err');
  }).catch(()=>toast('Sem conexão.','err'));
}
function load(){
  fetch('/api/controle/carregar').then(r=>r.json()).then(d=>{
    if(d.processos&&d.processos.length) _processos=d.processos;
    renderAll();
    document.getElementById('lastSync').textContent=
      new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }).catch(()=>{toast('Erro ao carregar dados.','err');renderAll();});
}

// ══ UTILS ════════════════════════════════════════════════════
function fd(iso){
  if(!iso)return'—';
  try{return new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}
  catch(e){return iso;}
}
function demurDias(p){
  if(!p.data_chegada)return null;
  const ft=parseInt(p.free_time)||21;
  const venc=new Date(new Date(p.data_chegada).getTime()+ft*86400000);
  return Math.ceil((venc-new Date())/86400000);
}
function toast(msg,t='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='toast on '+t;
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('on'),3000);
}
function limparFiltros(){
  ['fq','ff','fc','fp','fa'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  _filtStat='';
  render();
}

// ══ RENDER ALL ════════════════════════════════════════════════
function renderAll(){
  // Popular selects
  const cls=[...new Set(_processos.map(p=>p.cliente).filter(Boolean))].sort();
  const pts=[...new Set(_processos.map(p=>p.porto).filter(Boolean))].sort();
  const ags=[...new Set(_processos.map(p=>p.agente).filter(Boolean))].sort();
  ['fc','fp','fa'].forEach((id,i)=>{
    const el=document.getElementById(id);
    const arr=[cls,pts,ags][i];
    const v=el.value;
    el.innerHTML='<option value="">Todos</option>'+arr.map(x=>`<option>${x}</option>`).join('');
    el.value=v;
  });
  renderStats();
  render();
}

function renderStats(){
  const t=_processos.length;
  const and=_processos.filter(p=>p.fase!=='FINALIZADO').length;
  const crit=_processos.filter(p=>{const d=demurDias(p);return d!==null&&d<=5;}).length;
  const warn=_processos.filter(p=>{const d=demurDias(p);return d!==null&&d>5&&d<=10;}).length;

  const pill=(v,n,lbl,cls)=>`
    <div class="scard ${_filtStat===v?'on':''}" onclick="setFiltro('${v}')">
      <div class="sn ${cls}">${n}</div>
      <div class="sl">${lbl}</div>
    </div>`;

  document.getElementById('statsEl').innerHTML=
    pill('',t,'Total','blue')+
    pill('andamento',and,'Em Andamento','ok')+
    pill('warn',warn,'⚠ Demur 10d','warn')+
    pill('critico',crit,'🔴 Demur 5d','err')+
    FASES.map(f=>pill(f.id,_processos.filter(p=>p.fase===f.id).length,f.icon+' '+f.label,'dim')).join('');
}

function setFiltro(v){
  _filtStat=v;
  document.getElementById('ff').value='';
  renderStats();
  render();
}

// ══ TABELA ════════════════════════════════════════════════════
function filtrar(){
  const q=(document.getElementById('fq').value||'').toLowerCase();
  const ff=document.getElementById('ff').value;
  const fc=document.getElementById('fc').value;
  const fp=document.getElementById('fp').value;
  const fa=document.getElementById('fa').value;
  return _processos.filter(p=>{
    if(q&&![(p.referencia||''),(p.cliente||''),(p.produtos||''),(p.container||''),(p.navio||'')]
      .some(v=>v.toLowerCase().includes(q)))return false;
    if(ff&&p.fase!==ff)return false;
    if(fc&&p.cliente!==fc)return false;
    if(fp&&p.porto!==fp)return false;
    if(fa&&p.agente!==fa)return false;
    if(_filtStat==='andamento'&&p.fase==='FINALIZADO')return false;
    if(_filtStat==='critico'){const d=demurDias(p);if(d===null||d>5)return false;}
    if(_filtStat==='warn'){const d=demurDias(p);if(d===null||d<=5||d>10)return false;}
    if(FASES.map(f=>f.id).includes(_filtStat)&&p.fase!==_filtStat)return false;
    return true;
  }).sort((a,b)=>{
    const va=_sortK==='demurrage'?demurDias(a)??9999:a[_sortK]||'';
    const vb=_sortK==='demurrage'?demurDias(b)??9999:b[_sortK]||'';
    return va<vb?-_sortD:va>vb?_sortD:0;
  });
}

function render(){
  const procs=filtrar();
  document.getElementById('tcount').textContent=`${procs.length} de ${_processos.length} processo(s)`;

  document.getElementById('thead').innerHTML='<tr>'+COLS.map(c=>
    `<th class="${_sortK===c.k?(_sortD>0?'asc':'desc'):''}" onclick="sortBy('${c.k}')">${c.l}</th>`
  ).join('')+'<th></th></tr>';

  if(!procs.length){
    document.getElementById('tbody').innerHTML=`<tr><td colspan="${COLS.length+1}">
      <div class="empty">📋 Nenhum processo encontrado
        <div style="margin-top:8px"><button class="btn-clr" onclick="limparFiltros()">Limpar filtros</button></div>
      </div></td></tr>`;
    return;
  }

  document.getElementById('tbody').innerHTML=procs.map(p=>{
    const d=demurDias(p);
    const rowCls=d!==null?(d<=5?'trow demur-crit':d<=10?'trow demur-warn':'trow'):'trow';
    return `<tr class="${rowCls}" onclick="abrir(${p.id})">
      <td><span class="ref">${p.referencia||'—'}</span></td>
      <td style="max-width:130px;overflow:hidden;text-overflow:ellipsis">${p.cliente||'—'}</td>
      <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--text-dim)">${p.produtos||'—'}</td>
      <td><span class="status-chip s-${p.fase||'PRODUCAO'}">${FASES.find(f=>f.id===p.fase)?.icon||''} ${FASES.find(f=>f.id===p.fase)?.label||p.fase||'—'}</span></td>
      <td class="mono">${fd(p.eta)}</td>
      <td>${demurCell(d)}</td>
      <td style="font-size:11px">${p.porto||'—'}</td>
      <td>${p.canal_parametrizacao?`<span class="canal-chip cc-${p.canal_parametrizacao}">${p.canal_parametrizacao}</span>`:'<span style="color:var(--text-dim)">—</span>'}</td>
      <td style="font-size:11px;color:${p.status_lpco==='DEFERIDA'?'var(--ok)':p.status_lpco?'var(--warn)':'var(--text-dim)'}">${p.status_lpco||'—'}</td>
      <td style="font-size:11px;color:${p.anuencia==='DEFERIDA'?'var(--ok)':p.anuencia?'var(--warn)':'var(--text-dim)'}">${p.anuencia||'—'}</td>
      <td><div class="pend-cell" title="${p.pendencia_processo||''}">${p.pendencia_processo||'—'}</div></td>
      <td><button class="btn btn-s btn-sm" onclick="event.stopPropagation();abrir(${p.id})">Abrir</button></td>
    </tr>`;
  }).join('');
}

function demurCell(d){
  if(d===null)return'<span class="dc-n">—</span>';
  const cls=d<=5?'dc-e':d<=10?'dc-w':'dc-ok';
  const icon=d<=5?'🔴':d<=10?'⚠':'✓';
  return`<span class="demur-chip ${cls}">${icon} ${d}d</span>`;
}

function sortBy(k){
  if(_sortK===k)_sortD*=-1;else{_sortK=k;_sortD=1;}
  render();
}

// ══ MODAL ═════════════════════════════════════════════════════
function abrirNovo(){
  _edit={id:Date.now(),fase:'PRODUCAO',free_time:21,log:[],_meta:{}};
  _files={};
  renderModal(true);
  document.getElementById('ov').classList.add('on');
  tab('dados');
}
function abrir(id){
  const p=_processos.find(x=>x.id===id);
  if(!p)return;
  _edit=JSON.parse(JSON.stringify(p));
  _files={};
  renderModal(false);
  document.getElementById('ov').classList.add('on');
  tab('dados');
}
function fechar(){
  document.getElementById('ov').classList.remove('on');
  _edit=null;_files={};
}
function tab(t){
  document.querySelectorAll('.mtab').forEach((el,i)=>el.classList.toggle('on',['dados','ia','log'][i]===t));
  document.querySelectorAll('.mtc').forEach(el=>el.classList.remove('on'));
  document.getElementById('tc-'+t).classList.add('on');
}
function mudarFase(fid){
  if(!_edit)return;
  _edit.fase=fid;
  renderModal(!_processos.find(p=>p.id===_edit.id));
  tab('dados');
}

function renderModal(isNovo){
  const p=_edit;
  const faseIdx=FASES.findIndex(f=>f.id===p.fase);
  const d=demurDias(p);

  // Header
  document.getElementById('mh-title').innerHTML=
    isNovo?'Novo Processo':`<span>${p.referencia||'Processo'}</span>`;

  // Demurrage badge no header
  if(d!==null){
    const cls=d<=5?'background:rgba(220,38,38,.15);color:#dc2626':d<=10?'background:rgba(217,119,6,.15);color:#d97706':'background:rgba(22,163,74,.12);color:#16a34a';
    document.getElementById('mh-demur').innerHTML=
      `<div class="mh-demur" style="${cls}">${d<=5?'🔴':d<=10?'⚠':'✓'} Demurrage: ${d} dias</div>`;
  } else {
    document.getElementById('mh-demur').innerHTML='';
  }

  // Stepper
  const stepper=`<div class="stepper">${FASES.map((f,i)=>`
    <div class="step ${i<faseIdx?'done':i===faseIdx?'active':''}" onclick="mudarFase('${f.id}')">
      <div class="step-icon">${i<faseIdx?'✓':f.icon}</div>
      <div class="step-lbl">${f.label}</div>
    </div>`).join('')}</div>`;

  // Campos de identificação SEMPRE no topo
  const secIdentificacao=`<div class="sec">
    <div class="sec-hd">📌 Identificação</div>
    <div class="grid g3">
      ${renderField('referencia',p)}
      ${renderField('cliente',p)}
      ${renderField('agente',p)}
      ${renderField('porto',p)}
      ${renderField('marca',p)}
      ${renderField('finalidade',p)}
    </div>
    <div style="margin-top:9px">
      <div class="grid g2">
        ${renderField('pendencia_processo',p)}
        ${renderField('demanda_impak',p)}
      </div>
    </div>
  </div>`;

  // Seções de campos
  let secs=secIdentificacao;
  for(let i=0;i<=faseIdx;i++){
    const fase=FASES[i];
    const campos=FASE_CAMPOS[fase.id]||[];
    const camposFin=FASE_CAMPOS_FIN[fase.id]||[];
    const isAtual=i===faseIdx;

    secs+=`<div class="sec">
      <div class="sec-hd">${fase.icon} ${fase.label} ${isAtual?'<span class="sec-tag">fase atual</span>':''}
      </div>
      <div class="grid g3">${campos.map(c=>renderField(c,p)).join('')}</div>`;

    if(camposFin.length&&_u&&_u.fin){
      secs+=`<div style="margin-top:10px">
        <div class="sec-hd" style="color:var(--err)">💰 Financeiro <span class="sec-restricted">restrito</span></div>
        <div class="grid g3">${camposFin.map(c=>renderField(c,p)).join('')}</div>
      </div>`;
    }
    secs+='</div>';
  }



  document.getElementById('tc-dados').innerHTML=stepper+secs;

  // IA tab
  document.getElementById('tc-ia').innerHTML=`
    <p style="font-size:13px;color:var(--text-dim);margin-bottom:12px">
      Anexe os documentos. A IA extrai os dados e preenche os campos automaticamente.
    </p>
    <div class="upload-box" id="ubox" onclick="document.getElementById('uinput').click()"
         ondragover="event.preventDefault();this.classList.add('drag')"
         ondragleave="this.classList.remove('drag')"
         ondrop="dropDoc(event)">
      <input type="file" id="uinput" multiple accept=".pdf,.jpg,.jpeg,.png" onchange="addFiles(this.files)">
      <div style="font-size:22px;margin-bottom:5px">📎</div>
      <div style="font-size:13px;color:var(--text-dim)">Clique ou arraste os documentos</div>
      <div style="font-size:11px;color:var(--text-dim);margin-top:3px">PI · CI · PL · HBL · CE · DI · MAPA · LPCO · NF</div>
    </div>
    <div class="chips" id="chips"></div>
    <div id="eres"></div>`;

  // Log tab
  renderLog();

  // Footer
  const isNovo2=!_processos.find(p=>p.id===_edit.id);
  document.getElementById('mfoot').innerHTML=`
    ${!isNovo2?`<button class="btn btn-d btn-sm" onclick="excluir(${p.id})">Excluir</button>`:''}
    <div style="flex:1"></div>
    <button class="btn btn-s" onclick="fechar()">Cancelar</button>
    <button class="btn btn-p" onclick="salvar()">💾 Salvar</button>`;
}

function renderField(id,p){
  const label=FLABELS[id]||id;
  const val=p[id]||'';
  const meta=(p._meta||{})[id];
  const editedBy=meta?`<span class="by">${meta.n} · ${meta.t}</span>`:'';
  const changed=!!meta;

  if(DATE_FIELDS.has(id)){
    return`<div class="field">
      <label>${label} ${editedBy}</label>
      <input type="date" id="f_${id}" value="${val}" class="${changed?'changed':''}" oninput="markChange('${id}')">
    </div>`;
  }
  if(SELECT_FIELDS[id]){
    return`<div class="field">
      <label>${label} ${editedBy}</label>
      <select id="f_${id}" class="${changed?'changed':''}" onchange="markChange('${id}')">
        ${SELECT_FIELDS[id].map(o=>`<option value="${o}" ${val===o?'selected':''}>${o||'—'}</option>`).join('')}
      </select>
    </div>`;
  }
  if(id==='pendencia_processo'||id==='demanda_impak'||id==='observacoes'){
    return`<div class="field full">
      <label>${label} ${editedBy}</label>
      <textarea id="f_${id}" class="${changed?'changed':''}" oninput="markChange('${id}')">${val}</textarea>
    </div>`;
  }
  if(id==='quant_containers'){
    return`<div class="field">
      <label>${label} ${editedBy}</label>
      <input type="number" min="1" max="20" id="f_${id}" value="${val||1}" class="${changed?'changed':''}" oninput="markChange('${id}')">
    </div>`;
  }
  if(id==='free_time'){
    return`<div class="field">
      <label>${label} ${editedBy}</label>
      <input type="number" min="1" max="90" id="f_${id}" value="${val||21}" class="${changed?'changed':''}" oninput="markChange('${id}')">
    </div>`;
  }
  return`<div class="field">
    <label>${label} ${editedBy}</label>
    <input id="f_${id}" value="${val}" class="${changed?'changed':''}" oninput="markChange('${id}')">
  </div>`;
}

function markChange(id){
  const el=document.getElementById('f_'+id);
  if(el) el.classList.add('changed');
}

function coletar(){
  const ids=['referencia','cliente','produtos','finalidade','agente','porto','marca','quant_containers',
    'data_pedido','previsao_prontidao','data_prontidao','data_embarque','eta',
    'data_chegada','data_presenca','free_time','navio','armador','container',
    'hbl','mbl','bl_provado','data_ci','ce_master','ce_house',
    'anuencia','numero_di','data_di','canal_parametrizacao','status_mapa','status_lpco',
    'data_retirada','horario_retirada','data_ric','status_ric','nf_processo',
    'frete','pagamento_entrada','pagamento_saldo',
    'pendencia_processo','demanda_impak','observacoes','fase'];
  const obj={};
  ids.forEach(id=>{const el=document.getElementById('f_'+id);if(el)obj[id]=(el.value||'').trim();});
  return obj;
}

function salvar(){
  const dados=coletar();
  if(!dados.referencia){toast('Informe a referência.','err');return;}
  const now=new Date().toLocaleString('pt-BR');
  const quem=_u.n;
  if(!_edit._meta)_edit._meta={};
  if(!_edit.log)_edit.log=[];
  const changed=[];
  Object.keys(dados).forEach(id=>{
    const novo=dados[id]; const ant=_edit[id]||'';
    if(novo!==ant&&novo!==''){
      _edit._meta[id]={n:quem,t:now};
      changed.push({c:FLABELS[id]||id,de:ant,para:novo});
    }
    if(novo!==''||_edit[id]!==undefined) _edit[id]=novo;
  });
  _edit._updatedAt=Date.now();
  const isNovo=!_processos.find(p=>p.id===_edit.id);
  _edit.log.push({time:now,user:quem,msg:isNovo?'Processo criado':`${changed.length} campo(s) atualizado(s)`,fields:changed});
  if(isNovo) _processos.unshift(_edit);
  else{const i=_processos.findIndex(p=>p.id===_edit.id);if(i>=0)_processos[i]=_edit;}
  fechar();
  renderAll();
  save(()=>toast(isNovo?'Processo criado!':'Salvo!','ok'));
}

function excluir(id){
  if(!confirm('Excluir este processo? Esta ação não pode ser desfeita.'))return;
  _processos=_processos.filter(p=>p.id!==id);
  fechar();renderAll();
  save(()=>toast('Processo excluído.','ok'));
}

function renderLog(){
  const log=(_edit&&_edit.log)||[];
  if(!log.length){
    document.getElementById('tc-log').innerHTML=`<div style="text-align:center;padding:32px;color:var(--text-dim)">Sem histórico ainda.</div>`;
    return;
  }

    <div style="max-height:420px;overflow-y:auto">
      ${log.slice().reverse().map(l=>`
        <div class="log-row">

          <div style="flex:1">
            <div><span class="log-user">${l.user||''}</span>${l.user?' · ':''}<span style="font-size:12px">${l.msg}</span></div>
            ${(l.fields||[]).map(f=>`
              <div class="log-chg">
                ${f.c}: <span class="log-val">${f.de||'—'} → ${f.para}</span>

}

// ══ UPLOAD + IA ═══════════════════════════════════════════════
function dropDoc(e){e.preventDefault();document.getElementById('ubox').classList.remove('drag');addFiles(e.dataTransfer.files);}
function addFiles(files){Array.from(files).forEach(f=>{_files[f.name]=f;});renderChips();}
function renderChips(){
  const el=document.getElementById('chips');if(!el)return;
  el.innerHTML=Object.keys(_files).map(n=>`<div class="chip">${n}<span class="cx" onclick="rmFile('${n}')">×</span></div>`).join('');
  if(Object.keys(_files).length)
    el.innerHTML+=`<button class="btn btn-p btn-sm" onclick="extrair()" style="margin-left:6px">✨ Extrair com IA</button>`;
}
function rmFile(n){delete _files[n];renderChips();document.getElementById('eres').innerHTML='';}

async function extrair(){
  if(!_apiKey){toast('Sessão expirada. Faça login novamente.','err');return;}
  const files=Object.values(_files);
  if(!files.length){toast('Nenhum arquivo.','err');return;}
  document.getElementById('eres').innerHTML=
    `<div style="text-align:center;padding:20px;color:var(--text-dim)"><span class="spin"></span><div style="margin-top:8px;font-size:13px">Analisando documentos...</div></div>`;
  try{
    const parts=await Promise.all(files.map(async f=>{
      const b64=await toB64(f);
      return f.type==='application/pdf'
        ?{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}}
        :{type:'image',source:{type:'base64',media_type:f.type,data:b64}};
    }));
    parts.push({type:'text',text:`Você é especialista em documentos de importação brasileira de pneus.
Analise os documentos (PI, CI, PL, HBL, CE, DI, MAPA, LPCO, NF) e extraia:
referencia (apenas o código, ex: UD25-340, sem parênteses ou números extras),
cliente, produtos (APENAS UMA STRING com o nome do produto/pneu, ex: "PNEU TBR 295/80R22.5"), marca, agente, porto, armador, navio,
container (número do container), quant_containers (quantidade de containers, número inteiro),
hbl, mbl, eta (YYYY-MM-DD), data_embarque (YYYY-MM-DD), data_chegada (YYYY-MM-DD),
data_presenca (YYYY-MM-DD), data_prontidao (YYYY-MM-DD), data_pedido (YYYY-MM-DD),
ce_master, ce_house, numero_di, data_di (YYYY-MM-DD),
canal_parametrizacao (VERDE/AMARELO/VERMELHO/CINZA),
status_mapa (AG. ANALISE/LIBERADO/EXIGÊNCIA),
status_lpco (AG. ANALISE/DEFERIDA/EXIGÊNCIA/FAZER LPCO),
anuencia (SEM LI/DEFERIDA/PENDENTE),
data_retirada (YYYY-MM-DD), horario_retirada,
nf_processo, data_ci (YYYY-MM-DD),
pagamento_entrada (data ou valor), pagamento_saldo (data ou valor),
finalidade (DIRETO/LCL/DUIMP).
Responda SOMENTE JSON válido, sem markdown. Omita campos não encontrados.`});

    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json','x-api-key':_apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:2000,
        messages:[{role:'user',content:parts}]})
    });
    const raw=await r.text();
    if(!r.ok){
      document.getElementById('eres').innerHTML=
        `<div style="color:var(--err);padding:12px;font-size:13px">Erro da API (${r.status}): ${raw.slice(0,300)}</div>`;
      return;
    }
    const data=JSON.parse(raw);
    const txt=(data.content||[]).map(x=>x.text||'').join('');
    const clean=txt.replace(/```json|```/g,'').trim();
    if(!clean){
      document.getElementById('eres').innerHTML=
        `<div style="color:var(--err);padding:12px;font-size:13px">A IA não retornou dados. Tente com outro documento.</div>`;
      return;
    }
    const ex=JSON.parse(clean);
    mostrarExtracao(ex);
  }catch(e){
    document.getElementById('eres').innerHTML=
      `<div style="color:var(--err);padding:12px;font-size:13px">Erro: ${e.message}</div>`;
  }
}

function mostrarExtracao(ex){
  // Normalizar valores — converter objetos/arrays para string
  Object.keys(ex).forEach(k=>{
    if(ex[k]===null||ex[k]===undefined){ delete ex[k]; return; }
    if(typeof ex[k]==='object'){
      // Array de strings — juntar com vírgula
      if(Array.isArray(ex[k])) ex[k]=ex[k].join(', ');
      else ex[k]=Object.values(ex[k]).filter(Boolean).join(' ');
    }
    ex[k]=String(ex[k]).trim();
    if(!ex[k]) delete ex[k];
  });
  // Limpar referência
  if(ex.referencia) ex.referencia=ex.referencia.replace(/\s*\(\d+\)\s*/g,'').trim();
  const campos=Object.keys(ex).filter(k=>FLABELS[k]);
  if(!campos.length){
    document.getElementById('eres').innerHTML=`<div style="color:var(--text-dim);padding:12px;font-size:13px">Nenhum campo identificado.</div>`;
    return;
  }
  const rows=campos.map(k=>{
    const atual=(_edit||{})[k]||'';const novo=ex[k]||'';
    const badge=atual?(atual!==novo?'<span class="eb eb-c">ALTERADO</span>':''):'<span class="eb eb-n">NOVO</span>';
    return`<div class="erow"><div class="elbl">${FLABELS[k]}</div><div class="eval">${novo}</div>${badge}</div>`;
  }).join('');
  const enc=encodeURIComponent(JSON.stringify(ex));
  document.getElementById('eres').innerHTML=`
    <div class="ebox">
      <div style="font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.7px;margin-bottom:9px">
        ✨ ${campos.length} campo(s) identificado(s)
      </div>
      ${rows}
      <div style="margin-top:11px;display:flex;gap:8px">
        <button class="btn btn-p btn-sm" onclick="aplicar('${enc}')">✓ Aplicar e revisar</button>
        <button class="btn btn-s btn-sm" onclick="document.getElementById('eres').innerHTML=''">Cancelar</button>
      </div>
    </div>`;
}

function aplicar(enc){
  const ex=JSON.parse(decodeURIComponent(enc));
  Object.keys(ex).forEach(k=>{
    if(ex[k]===null||ex[k]===undefined) return;
    // Converter objetos para string
    const v = typeof ex[k]==='object' ? JSON.stringify(ex[k]) : String(ex[k]);
    // Limpar referência (remover números entre parênteses)
    if(k==='referencia'){
      _edit[k] = v.replace(/\s*\(\d+\)\s*/g,'').trim();
    } else {
      _edit[k] = v;
    }
  });
  const isNovo=!_processos.find(p=>p.id===_edit.id);
  renderModal(isNovo);
  tab('dados');
  toast(`${Object.keys(ex).length} campo(s) preenchidos — revise e salve.`,'ok');
}

async function toB64(f){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(',')[1]);
    r.onerror=()=>rej(new Error('Falha ao ler arquivo'));
    r.readAsDataURL(f);
  });
}

function importarExcel(files){
  if(!files.length) return;
  
  // Modal de progresso
  const ov = document.createElement('div');
  ov.id = 'importOv';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(10,30,60,.55);z-index:9000;display:flex;align-items:center;justify-content:center;';
  ov.innerHTML = `
    <div style="background:#fff;border-radius:14px;padding:28px 32px;width:500px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,.25)">
      <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:var(--text-bright);margin-bottom:4px">📥 Importar Planilhas</div>
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:18px">Lendo os arquivos Excel...</div>
      <div style="background:var(--bg2);border-radius:4px;height:8px;overflow:hidden;margin-bottom:12px">
        <div id="impBar" style="background:var(--accent);height:100%;border-radius:4px;width:0;transition:width .3s"></div>
      </div>
      <div id="impStatus" style="font-size:12px;color:var(--text-dim);font-family:'DM Mono',monospace;margin-bottom:16px">Aguardando...</div>
      <div id="impResult" style="display:none"></div>
      <div style="text-align:right;margin-top:12px">
        <button id="impClose" class="btn btn-s btn-sm" onclick="document.getElementById('importOv').remove()" style="display:none">Fechar</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  setTimeout(()=>processarExcels(files), 100);
}

async function processarExcels(files){
  const setBar = p => document.getElementById('impBar').style.width = p+'%';
  const setStatus = t => { const el=document.getElementById('impStatus'); if(el) el.textContent=t; };
  const fileArr = Array.from(files);
  
  let controleWB = null, followUpWB = null;
  
  // Identificar qual arquivo é qual
  for(const f of fileArr){
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    const sheetNames = wb.SheetNames.join(',').toLowerCase();
    if(sheetNames.includes('controle') || sheetNames.includes('relatório')){
      controleWB = wb;
      setStatus('Planilha Controle identificada: ' + f.name);
    } else if(sheetNames.includes('andamento') || sheetNames.includes('finalizados')){
      followUpWB = wb;
      setStatus('Planilha Follow Up identificada: ' + f.name);
    } else {
      // Tentar identificar pelo conteúdo
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      const header = (rows[0]||[]).join(',').toLowerCase();
      if(header.includes('processos') && header.includes('cliente')){
        controleWB = wb;
      } else if(header.includes('referência') && header.includes('hbl')){
        followUpWB = wb;
      }
    }
  }

  setBar(20);

  function fmtDate(v){
    if(!v) return '';
    if(v instanceof Date) return v.toISOString().slice(0,10);
    const s = String(v).trim();
    // DD/MM/YY ou DD/MM/YYYY
    const m1 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
    if(m1){
      const y = m1[3].length===2 ? '20'+m1[3] : m1[3];
      return `${y}-${m1[2].padStart(2,'0')}-${m1[1].padStart(2,'0')}`;
    }
    // YYYY-MM-DD
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
    return '';
  }

  function clean(v){ return v===null||v===undefined?'':String(v).trim(); }

  function faseFromDados(p){
    if(p.data_ric) return 'FINALIZADO';
    if(p.data_retirada) return 'RETIRADO';
    if(p.numero_di || p.canal_parametrizacao) return 'LIBERACAO';
    if(p.data_chegada || p.data_presenca) return 'PORTO';
    if(p.data_embarque || p.hbl) return 'EMBARCADO';
    return 'PRODUCAO';
  }

  const processos = {};
  const agora = new Date().toLocaleString('pt-BR');

  // ── Processar Controle ──
  if(controleWB){
    setStatus('Processando planilha Controle...');
    const ws = controleWB.Sheets['CONTROLE'] || controleWB.Sheets[controleWB.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false});
    const header = rows[0]||[];
    
    for(let i=1;i<rows.length;i++){
      const row = rows[i];
      const ref = clean(row[1]);
      if(!ref) continue;
      
      const p = {
        id: Date.now() + i,
        referencia: ref,
        cliente: clean(row[2]),
        produtos: clean(row[3]),
        finalidade: clean(row[4]),
        pendencia_processo: clean(row[5]),
        quant_containers: clean(row[6]),
        agente: clean(row[7]),
        porto: clean(row[8]),
        marca: clean(row[9]),
        data_pedido: fmtDate(row[10]),
        data_prontidao: fmtDate(row[11]),
        data_embarque: fmtDate(row[12]),
        data_chegada: fmtDate(row[13]),
        data_presenca: fmtDate(row[14]),
        anuencia: clean(row[15]),
        bl_provado: clean(row[16]),
        pagamento_entrada: fmtDate(row[17])||clean(row[17]),
        data_retirada: fmtDate(row[19]),
        horario_retirada: clean(row[20]),
        frete: clean(row[21]),
        data_ric: fmtDate(row[22]),
        status_ric: clean(row[23]),
        armador: clean(row[24]),
        nf_processo: clean(row[28]),
        previsao_prontidao: fmtDate(row[30]),
        free_time: 21,
        _meta: {},
        log: [{time:agora, user:'Importação Excel', msg:'Importado da planilha Controle', fields:[]}],
      };
      p.fase = faseFromDados(p);
      processos[ref] = p;
    }
    setStatus('Controle: ' + Object.keys(processos).length + ' processos lidos');
  }

  setBar(50);

  // ── Processar Follow Up ──
  if(followUpWB){
    setStatus('Processando planilha Follow Up...');
    const sheetName = followUpWB.SheetNames.find(s=>s.toLowerCase().includes('andamento')) || followUpWB.SheetNames[0];
    const ws = followUpWB.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false});
    
    let enriq = 0;
    for(let i=1;i<rows.length;i++){
      const row = rows[i];
      const ref = clean(row[0]);
      if(!ref) continue;
      
      // HBL/MBL separados por quebra de linha
      const hblMbl = clean(row[3]).split(/\n|\r/);
      const ceMasterHouse = clean(row[7]).split(/\n|\r/);
      const armAg = clean(row[13]).split(/\n|\r/);
      
      const extra = {
        hbl: clean(hblMbl[0]),
        mbl: clean(hblMbl[1]||''),
        navio: clean(row[5]),
        container: clean(row[11]),
        numero_di: clean(row[8]),
        data_di: fmtDate(row[9]),
        data_ci: fmtDate(row[10]),
        ce_master: clean(ceMasterHouse[0]),
        ce_house: clean(ceMasterHouse[1]||''),
        status_mapa: clean(row[6]||'').slice(0,80),
        demanda_impak: clean(row[14]||'').slice(0,200),
      };
      
      if(processos[ref]){
        // Enriquecer sem sobrescrever campos já preenchidos
        Object.keys(extra).forEach(k=>{ if(extra[k]&&!processos[ref][k]) processos[ref][k]=extra[k]; });
        enriq++;
      } else {
        // Criar novo processo com dados do Follow Up
        const chegadaInfo = clean(row[4]).split(/\n|\r/);
        processos[ref] = {
          id: Date.now() + i + 10000,
          referencia: ref,
          agente: clean(armAg[1]||''),
          armador: clean(armAg[0]||''),
          fase: 'EMBARCADO',
          free_time: 21, _meta: {},
          log: [{time:agora, user:'Importação Excel', msg:'Importado do Follow Up', fields:[]}],
          ...extra,
        };
      }
    }
    setStatus('Follow Up: ' + enriq + ' processos enriquecidos');
  }

  setBar(75);

  // ── Mesclar com existentes no sistema ──
  setStatus('Verificando processos já cadastrados...');
  let existentes = [];
  try{
    const resp = await fetch('/api/controle/carregar');
    const d = await resp.json();
    existentes = d.processos||[];
  }catch(e){}

  const existentesRefs = new Set(existentes.map(p=>p.referencia));
  const novos = Object.values(processos).filter(p=>!existentesRefs.has(p.referencia));
  const total = [...existentes, ...novos];

  setStatus('Salvando ' + total.length + ' processos no Drive...');
  setBar(88);

  try{
    const resp = await fetch('/api/controle/salvar',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({processos: total})
    });
    const d = await resp.json();
    setBar(100);

    const el = document.getElementById('impResult');
    if(el){
      if(d.ok){
        el.innerHTML = '<div style="background:rgba(22,163,74,.08);border:1px solid rgba(22,163,74,.2);border-radius:7px;padding:12px;font-size:13px;color:var(--ok);font-weight:600">'
          + '✓ Importação concluída!<br>'
          + '<span style="font-weight:400;font-size:12px">'
          + novos.length + ' novos · ' + existentes.length + ' já existiam · ' + total.length + ' total</span></div>';
        // Atualizar lista
        _processos = total;
        renderAll();
      } else {
        el.innerHTML = '<div style="color:var(--err);font-size:13px">Erro ao salvar. Tente novamente.</div>';
      }
      el.style.display = 'block';
    }
  }catch(e){
    const el = document.getElementById('impResult');
    if(el){ el.innerHTML = '<div style="color:var(--err);font-size:13px">Erro: '+e.message+'</div>'; el.style.display='block'; }
  }

  const closeBtn = document.getElementById('impClose');
  if(closeBtn) closeBtn.style.display = 'inline-flex';
  setStatus('Concluído.');
}
